<!DOCTYPE html>
<html>

        <title>Map</title>
        <style>

    </head>
    <body>
        <script src='https://cdn.jsdelivr.net/npm/ol@v7.1.0/dist/ol.js'></script>
        <script src='https://code.jquery.com/jquery-3.6.2.min.js' integrity='sha256-2krYZKh//PcchRtd+H+VyyQoZ/e3EcrkxhM8ycwASPA=' crossorigin='anonymous'></script>
        <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/ol@v7.1.0/ol.css'>
        <div id="toolbar" class='toolbar'>
            <span id="showRouteTable" class="btn toggled-off" onclick="showRouteTable()">Routes</span>
            <span id="hideRouteTable" class="btn toggled-on"  onclick="closeRouteTable()">Routes</span>
            <span id="showLocationTable" class="btn toggled-off" onclick="showLocationTable()">Locations</span>
            <span id="hideLocationTable" class="btn toggled-on"  onclick="closeLocationTable()">Locations</span>
            <span id="showJson"  class="btn toggled-off" onClick="showJson();">JSON</span><!--
          --><span id="hideJson"  class="btn toggled-on"  onClick="closeJson();">JSON</span><!--
          --><div class="separator"></div><!--
          --><span id="undo" class="btn" onClick="removeLastPoint();">Undo</span><!--
          --><div class="separator"></div><!--
          --><span id="open" class="btn" onClick="showOpenDialog();">Open</span>
        </div>
        <div id='map' style='position: fixed; top: 33px; left: 0; bottom: 0; right: 0;'></div>
        <!-- position: fixed; top: 0; left: 0; bottom: 0; right: 0; -->
        <div id="table-popup" class="ol-popup" style="display: none;">
            <div id="popup-content">
                <div class="toolbar"><span>Tour Table</span>
                    <span class="btn" onClick="closeRouteTable();" style="float:right">&times</span>
                </div>
                <div id="tablediv" class="content">
                    <form>
                        <label for="name">Name</label>
                        <input id="name" type="text" onchange="saveTableDataToModel()"/>
                        <label for="type">Type</label>
                        <input id="type" type='text' onchange="saveTableDataToModel()"/>
                        <label for="year">Year</label>
                        <input id="year" type='number' onchange="saveTableDataToModel()"/>
                        <label for="colour">Colour</label>
                        <input id="colour" type='color' onchange="saveTableDataToModel()"/>                        
                        <label for="lineStyle">Line Style</label>
                        <select id="lineStyle" onchange="saveTableDataToModel()">
                            <option value="dashed">Dashed</option>
                            <option value="solid">Solid</option>
                        </select>
                    </form>
                    <table id="route-table">
                        <thead>
                            <tr>
                                <th>From Lat</th>
                                <th>From Lon</th>
                                <th>From Name</th>
                                <th>To Lat</th>
                                <th>To Lon</th>
                                <th>To Name</th>
                                <th>Segment Description</th>
                            </tr>
                        </thead>
                        <tbody id="route-table-body">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="json-popup" class="ol-popup" style="display: none;">
            <div id="popup-content">
                <div class="toolbar"><span>Tour JSON</span>
                    <span class='btn' onClick="closeJson();" style="float:right">&times</span>
                </div>
                <div class="content">
                    <button onClick="copyJson();">Copy JSON to Clipboard</button>
                    <div class='jsonContent' id="jsonContent"></div>
                </div>

        <div id="open-popup" class="ol-popup" style="display: none;">
            <div id="open-popup-content">
                <div class="toolbar"><span>Open File</span>
                    <span class='btn' onClick="closeOpenDialog();" style="float:right">&times</span>

                    <input id="file" type="file"/>

                </div>

                    <span class='btn' onClick="closeLocationTable();" style="float:right">&times</span>
                </div>
                <div class="content">
                    <table id="location-table">
                        <thead>
                            <tr>
                                <th>Lat</th>
                                <th>Lon</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Type</th>
                            </tr>
                        </thead>

                        </tbody>
                        <button onclick="addLocationToTable(0, 0, '');">Add New Location</button>
                    </table>

            </div>
        </div>
       
    </body>
<script>

let map;
let overlay;
var vectorLine;
let vectorLineLayer;
var featureLine;
var locationPointFeature;
var highlightLineVectorSource;
var highlightLine;
let highlightLinesLayer;
var locationFeatures = [];

let points = [];
let routeTableData = [];
let locationTableData = [];

var name = "" + new Date().toISOString() + " Tour";
var type = "Tour"
var year = new Date().getFullYear();
var colour = "#249efa"
var lineStyle = "Solid"

var mode = "draw";
var spliceData = {};
var locationIndex = -1;

let draw;

const source = new ol.source.Vector();

var vector = new ol.layer.Vector({
  source: source,
});

const closer = document.getElementById('popup-closer');

function loadFile(){
    var el = document.getElementById('file');
    var file = el.files[0];
    if (!file) {
        return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
        var contents = e.target.result;
        var json = JSON.parse(contents);

        name = json.details.name;
        type = json.details.type;
        year = json.details.year;
        colour = json.details.style.colour;
        lineStyle = json.details.style.line;

        var routes = json.routes;
        routes.forEach(r => {
            var data = makeNewTableRowData();

            data.from.lat = r.from.lat;
            data.from.lon = r.from.lon;
            data.from.name = r.from.name;
            data.to.lat = r.to.lat;
            data.to.lon = r.to.lon;
            data.to.name = r.to.name;
            data.segment.description = r.description;

            routeTableData.push(data);
        });

        var locations = json.locations;

        locations.forEach(l => {
            locationTableData.push(l);
        });

        refreshDraw();
    };
    reader.readAsText(file);
    closeOpenDialog();
}

function copyJson(){
    var copyText = document.getElementById("jsonContent").children[0].innerHTML;
    navigator.clipboard.writeText(copyText);
}

function closeRouteTable(){
    document.getElementById('table-popup').style.display='none';

    document.getElementById('hideRouteTable').style.display='none';
    document.getElementById('showRouteTable').style.display='inline-block';

    saveTableDataToModel();
}

function closeJson(){
    document.getElementById('json-popup').style.display='none';

    document.getElementById('hideJson').style.display='none';
    document.getElementById('showJson').style.display='inline-block';

}

function createMap(){
    vectorLine = new ol.source.Vector({});
    vectorLineLayer = new ol.layer.Vector({'id':'lines'});

    highlightLineVectorSource = new ol.source.Vector({});
    highlightLinesLayer = new ol.layer.Vector({'id':'highlightLines'});

    map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM(),
            }),
            vector,
            highlightLinesLayer,
            vectorLineLayer
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([-2.89479, 54.093409]),
            zoom: 5,
        }),
        controls: ol.control.defaults.defaults().extend([
            new ol.control.FullScreen()
        ]),
    });

    draw = new ol.interaction.Draw({
        source: source,
        type: 'LineString',
    })
    map.addInteraction(draw);
    vectorLineLayer.setSource(vectorLine);
}

function addPoint(location){
    let lat = location.lat;
    let lon = location.lon;

    locationPointFeature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        name: location.name + ' (' + location.description + ')'
    });

    locationPointFeature.setStyle(new ol.style.Style({
        image: new ol.style.RegularShape({
            stroke: new ol.style.Stroke({color: 'black', width: 2}),
            fill: new ol.style.Fill({color: colour}),
            points: 4,
            radius: 4,
            angle: Math.PI / 4,
        }),
    }));

    locationFeatures.push(locationPointFeature);

    vectorLine.addFeature(locationPointFeature);
    vectorLineLayer.setSource(vectorLine);

};

function addConnection(from, to){
    var connectionPoints = [
        [from.lon, from.lat],
        [to.lon, to.lat]];

    for (var i = 0; i < connectionPoints.length; i++) {
        connectionPoints[i] = ol.proj.transform(connectionPoints[i], 'EPSG:4326', 'EPSG:3857');
    }

    featureLine = new ol.Feature({
        geometry: new ol.geom.LineString(connectionPoints),
    });

    featureLine.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: colour,
            width: 2
        })
    }));

    vectorLine.addFeature(featureLine);
    vectorLineLayer.setSource(vectorLine);
}

function registerMapHandler(){
    map.on('click', function (evt) {

        var latlon =  ol.proj.toLonLat(evt.coordinate)

        var lat = latlon[1];
        var lon = latlon[0];

        if(mode === "draw"){

            points.push({
                'lat':lat,
                'lon':lon
            })
            
            if(points.length > 1){
                var end = points[points.length-1];
                var prev = points[points.length-2];

                var row = makeNewTableRowData();
                row.from.lat = prev.lat;
                row.from.lon = prev.lon;
                row.from.name = "";
                row.to.lat = end.lat;
                row.to.lon = end.lon;
                row.to.name = "";
                row.segment.description = "";

                routeTableData.push(row);
            }
        }
        else if (mode === "splice"){
            finishSpliceRoute(
                spliceData.from.lat,
                spliceData.from.lon,
                spliceData.to.lat,
                spliceData.to.lon,
                lat, lon);
        }
        else if(mode === "location-get-coords"){
            finishUpdatingLocationCoords(lat, lon, locationIndex);
        }

        populateTables();
    });
}

function makeNewTableRowData(){
    var row = {};
    row.from = {};
    row.to = {};
    row.segment = {};
    return row;
}

function unhighlightAndDeletePoint(el, index){
    removePoint(index);
    unhighlight(el);
}

function unhighlightAndDeleteLocation(el, index){
    removeLocation(index);
    unhighlight(el);
}

function removeLocation(index){
    if(locationTableData.length >= 1){
        var locationTableDataCopy = [];
        locationTableData.forEach(row => {locationTableDataCopy.push(row)})
        locationTableData.length = 0;
        locationTableDataCopy.splice(index, 1);
        locationTableDataCopy.forEach(row => {locationTableData.push(row);});
    }
    populateTables();
    refreshDraw();
}

function removePoint(index){
    if(routeTableData.length >= 1){
        var routeTableDataCopy = [];
        routeTableData.forEach(row => {routeTableDataCopy.push(row)})
        routeTableData.length = 0;
        routeTableDataCopy.splice(index, 1);
        routeTableDataCopy.forEach(row => {routeTableData.push(row);});
    }
    populateTables();
    refreshDraw();
}

function removeLastPoint(){
    if(routeTableData.length >= 1){
        removePoint(routeTableData.length-1);
    }
    refreshDraw();
}

function refreshDraw(){
    draw.finishDrawing();
    map.removeInteraction(draw);
    vectorLine.removeFeature(featureLine);
    vectorLine.removeFeature(locationPointFeature);
    locationFeatures.forEach(location => {
        vectorLine.removeFeature(location);
    });
    map.removeLayer(vector);

    featureLine = new ol.Feature({
        geometry: new ol.geom.LineString(points)
    });
    locationPointFeature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([0, 0])),
    });

    routeTableData.forEach(row => {
        addConnection(row.from, row.to);
    });

    locationTableData.forEach(row => {
        addPoint(row);
    });

    draw = new ol.interaction.Draw({
        source: source,
        type: 'LineString',
    });

    map.addInteraction(draw);
    if(routeTableData.length >= 1) {
        draw.extend(featureLine);
    }
   
}

function unhighlight(el){
    highlightLineVectorSource.removeFeature(highlightLine);
}

function highlight(el){
    unhighlight(el);
    let fromLat = $(el.target).closest('tr')[0].getAttribute('fromLat');
    let fromLon = $(el.target).closest('tr')[0].getAttribute('fromLon');
    let toLat = $(el.target).closest('tr')[0].getAttribute('toLat');
    let toLon = $(el.target).closest('tr')[0].getAttribute('toLon');
    
    var points = [
        [fromLon, fromLat],
        [toLon, toLat]];

    for (var i = 0; i < points.length; i++) {
        points[i] = ol.proj.transform(points[i], 'EPSG:4326', 'EPSG:3857');
    }

    highlightLine = new ol.Feature({
        geometry: new ol.geom.LineString(points)
        
    });

    highlightLine.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({
            color: '#990000',
            width: 10
        })
    }));

    highlightLineVectorSource.addFeature(highlightLine);
    highlightLinesLayer.setSource(highlightLineVectorSource);

}

function populateTables(){

    document.getElementById("name").value = name; 
    document.getElementById("type").value = type;
    document.getElementById("year").value = year;
    document.getElementById("colour").value = colour;
    document.getElementById("lineStyle").value = lineStyle.toLowerCase();

    var routeTable = document.getElementById('route-table');
    var routeTableBody = document.getElementById('route-table-body');
    var newRouteTableBody = document.createElement("tbody");
    newRouteTableBody.setAttribute("id", "route-table-body");

    for(var i=0; i<routeTableData.length; i++){
        var row = routeTableData[i];
        var tr = document.createElement('tr');
        tr.addEventListener('mouseover', highlight, false);
        tr.addEventListener('mouseout', unhighlight, false);
        tr.setAttribute('fromLat', row.from.lat);
        tr.setAttribute('fromLon', row.from.lon);
        tr.setAttribute('toLat', row.to.lat);
        tr.setAttribute('toLon', row.to.lon);

        tr.appendChild(makeTd("label", row.from.lat));
        tr.appendChild(makeTd("label", row.from.lon));
        tr.appendChild(makeTd("text", row.from.name));
        tr.appendChild(makeTd("label", row.to.lat));
        tr.appendChild(makeTd("label", row.to.lon));
        tr.appendChild(makeTd("text", row.to.name));
        tr.appendChild(makeTd("text", row.segment.description));

        let fromLat = row.from.lat;
        let fromLon = row.from.lon;
        let toLat = row.to.lat;
        let toLon = row.to.lon;

        var fn = function() { 
            startSpliceRoute(fromLat, fromLon, toLat, toLon, rowFromName);
        };
        tr.appendChild(makeTd("button", "Splice", fn));

        let rowFromName = row.from.name;
        var fn = function() { 
            addLocationToTable(fromLat, fromLon, rowFromName);
        };
        tr.appendChild(makeTd("button", "Add Start Location", fn));

        let rowToName = row.to.name;
        var fn = function() { 
            addLocationToTable(toLat, toLon, rowToName);
        };
        tr.appendChild(makeTd("button", "Add End Location", fn));

        let index = i;
        var fn = function() { 
            unhighlightAndDeletePoint(this, index);
        };
        tr.appendChild(makeTd("button", "Delete", fn));
        
        newRouteTableBody.appendChild(tr);
        
    }
    routeTable.replaceChild(newRouteTableBody, routeTableBody);

    var locationTable = document.getElementById('location-table');
    var locationTableBody = document.getElementById('location-table-body');
    var newLocationTableBody = document.createElement("tbody");
    newLocationTableBody.setAttribute("id", "location-table-body");

    for(var i=0; i<locationTableData.length; i++){
        var row = locationTableData[i];
        var tr = document.createElement('tr');
        
        tr.appendChild(makeTd("text", row.lat));
        tr.appendChild(makeTd("text", row.lon));
        tr.appendChild(makeTd("text", row.name));
        tr.appendChild(makeTd("text", row.description));
        tr.appendChild(makeTd("select", row.type, ["Point", "Intersection", "Route Intersection"]));
        let index = i;
        var locFn = function() { 
            setLocationCoordsFromMap(index);
        };
        tr.appendChild(makeTd("button", "Set Location from Map", locFn));
        var fn = function() { 
            unhighlightAndDeleteLocation(this, index);
        };
        tr.appendChild(makeTd("button", "Delete", fn));
        
        newLocationTableBody.appendChild(tr);
        
    }
    locationTable.replaceChild(newLocationTableBody, locationTableBody);

}
function setLocationCoordsFromMap(index){
    draw.finishDrawing();
    mode = "location-get-coords";
    locationIndex = index;
}

function finishUpdatingLocationCoords(lat, lon, index){
    mode = "draw";

    var location = locationTableData[index];

    location.lat = lat;
    location.lon = lon;

    populateTables();
    refreshDraw();
}

function startSpliceRoute(fromLat, fromLon, toLat, toLon){
    draw.finishDrawing();
    mode = "splice";
    spliceData.from = {};
    spliceData.from.lat = fromLat;
    spliceData.from.lon = fromLon;
    spliceData.to = {};
    spliceData.to.lat = toLat;
    spliceData.to.lon = toLon;
}

function finishSpliceRoute(fromLat, fromLon, toLat, toLon, spliceLat, spliceLon){
    mode = "draw";
    var routeMatches = (route) => {
        return route.from.lat === fromLat && 
        route.from.lon === fromLon && 
        route.to.lat === toLat &&
        route.to.lon === toLon
    }
    var firstPartOfSplice = routeTableData.find(routeMatches);
    var index = routeTableData.indexOf(firstPartOfSplice);

    firstPartOfSplice.to.lat = spliceLat;
    firstPartOfSplice.to.lon = spliceLon;

    var newPartOfSplice = makeNewTableRowData();
    newPartOfSplice.from.lat = spliceLat;
    newPartOfSplice.from.lon = spliceLon;
    newPartOfSplice.from.name = firstPartOfSplice.from.name;
    newPartOfSplice.from.description = firstPartOfSplice.from.description;
    newPartOfSplice.to.lat = toLat;
    newPartOfSplice.to.lon = toLon;
    newPartOfSplice.to.name = firstPartOfSplice.to.name;
    newPartOfSplice.to.description = firstPartOfSplice.to.description;
    newPartOfSplice.segment.description = firstPartOfSplice.segment.description;

    routeTableData.splice(index + 1, 0, newPartOfSplice);
    populateTables();
    refreshDraw();
}

function makeTd(type, value, options){
    var td = document.createElement("td");

    switch(type) {
        case "label": {
            td.innerHTML = value;
            break;
        }
        case "text": {
            var input = document.createElement("input");
            input.setAttribute("type", "text");
            input.setAttribute("value", value);
            input.addEventListener('change', saveTableDataToModel, false);
            td.appendChild(input);
            break;
        }
        case "checkbox": {
            var input = document.createElement("input");
            input.setAttribute("type", "checkbox");
            if(value === true){
                input.setAttribute("checked", true);
            }
            input.addEventListener('change', saveTableDataToModel, false);
            td.appendChild(input);
            break;
        }
        case "select": {
            var select = document.createElement("select");
            options.forEach(opt => {
                var option = document.createElement("option");
                var sanitisedValue = opt.toLowerCase().replace(" ", "-");
                option.setAttribute("value", sanitisedValue);
                option.innerHTML = opt;
                if(value === sanitisedValue){
                    option.setAttribute("selected", true)
                }
                select.addEventListener('change', saveTableDataToModel, false);
                select.appendChild(option);
            })
            td.appendChild(select);
            break;
        }
        case "button": {
            var btn = document.createElement("button");
            btn.innerHTML = value;
            btn.onclick = options;
            td.appendChild(btn);
        }
    }

    return td;
}

function addLocationToTable(lat, lon, name){
    var location = {};
    location.lat = lat;
    location.lon = lon;
    location.name = name;
    location.description = "";
    location.type = "point";
    locationTableData.push(location);
    populateTables();
}

function saveTableDataToModel(){
    routeTableData.length=0;
    locationTableData.length=0;

    name = document.getElementById("name").value 
    type = document.getElementById("type").value 
    year = document.getElementById("year").value 
    colour = document.getElementById("colour").value
    lineStyle = document.getElementById("lineStyle").value

    var routeRows = document.getElementById('route-table-body');

    for(var i=0; i<routeRows.children.length; i++){
        var data = makeNewTableRowData();
        var row = routeRows.children[i];
        var fromLat = row.children[0].innerHTML;
        var fromLon = row.children[1].innerHTML;
        var fromName = row.children[2].children[0].value;

        var toLat = row.children[3].innerHTML;
        var toLon = row.children[4].innerHTML;
        var toName = row.children[5].children[0].value;

        var segmentDescription = row.children[6].children[0].value;

        data.from.lat = fromLat;
        data.from.lon = fromLon;
        data.from.name = fromName;
        data.to.lat = toLat;
        data.to.lon = toLon;
        data.to.name = toName;
        data.segment.description = segmentDescription;

        routeTableData.push(data);
    }

    var locationRows = document.getElementById('location-table-body');

    for(var i=0; i<locationRows.children.length; i++){
        var data = {};
        var row = locationRows.children[i];
        var lat = row.children[0].children[0].value;
        var lon = row.children[1].children[0].value;
        var name = row.children[2].children[0].value;
        var description = row.children[3].children[0].value;
        var type= row.children[4].children[0].value;

        data.lat = lat;
        data.lon = lon;
        data.name = name;
        data.description = description;
        data.type = type

        locationTableData.push(data);
    }
}

function getJson(){

    var rows = routeTableData;

    var routes = [];

    for(var i=0; i<rows.length; i++){
        var row = rows[i];
       
        routes.push({
            'from':{
                'lat': row.from.lat,
                'lon': row.from.lon,
                'name': row.from.name
            },
            'to':{
                'lat': row.to.lat,
                'lon': row.to.lon,
                'name': row.from.name
            },
            'description': row.segment.description
        });

    }

    var locations = locationTableData;

    var json = {
        "details": {
            "name": name, 
            "type": type,
            "year": parseInt(year, 10),
            "style": {
                "colour": colour,
                "line": lineStyle
            }
        },
        "locations":locations,
        "routes": routes
    }
    var jsonStr = "<pre>"+JSON.stringify(json, null, 4)+"</pre>";
    
    var jsonContentDiv = document.getElementById("jsonContent");
    jsonContentDiv.innerHTML = jsonStr;
}
